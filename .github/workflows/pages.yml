name: Deploy Agent Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the static demo
        run: |
          mkdir -p _site/skills/site-assembly/assets/starter
          cp -R demo _site/demo
          cp skills/site-assembly/assets/starter/{agent-build.js,agent-build.css,agent-tour.js} _site/skills/site-assembly/assets/starter/
          printf '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./demo/"><title>Agent Lab</title><a href="./demo/">Open Agent Lab</a></html>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
